# pytest configuration for the RecoverAI backend.
#
# Run the suite with `python -m pytest` from this directory.

[pytest]
testpaths = tests

# This one line is what makes `from app.policy.engine import PolicyEngine` resolve
# inside a test, with no PYTHONPATH set and no `pip install -e .` step. It puts
# the rootdir (backend/) on sys.path for the duration of the run.
#
# It earns its place because setting an environment variable is the single step in
# this project most likely to go wrong on the target machine: PowerShell, cmd.exe
# and Git Bash each want a different syntax for it, and `set PYTHONPATH=.` does
# not survive being typed in the wrong shell. Making the config file carry the
# knowledge removes the step entirely.
#
# The alternative -- packaging the backend and installing it in editable mode --
# adds a build backend, a pyproject and an install step to a project whose whole
# setup promise is "clone, pip install -r requirements.txt, run".
pythonpath = .

# -q: the signal in a failing test run is the traceback, not the progress bar.
# --strict-markers: an unregistered @pytest.mark is a typo, and a typo'd marker
# silently does nothing -- which is how a test ends up believing it is skipped,
# parametrised or filtered when it is not.
addopts = -q --strict-markers

# scikit-learn, pandas and their transitive dependencies emit deprecation notices
# on almost every import. Left on, they bury the output that matters; a real
# deprecation affecting this code would surface as a failure, not a warning.
filterwarnings = ignore::DeprecationWarning
